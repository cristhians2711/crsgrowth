let ui={step:0,lang:'es',ac:[]};
let state={drafts:[],currentId:null,localSeq:1};
const DB_NAME='mir_albaranes_v1_demo', DB_STORE='kv';
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(DB_STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbGet(k){try{const db=await idbOpen();return await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readonly');const r=tx.objectStore(DB_STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return null}}
async function dbSet(k,v){try{const db=await idbOpen();await new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});markSaved()}catch(e){console.error(e)}}
async function load(){const s=await dbGet('state');if(s)state=s;ui.lang=localStorage.getItem('mir_lang')||'es';document.getElementById('lang').value=ui.lang;if(!state.currentId||!getAlb())newDraft(false);render();networkUpdate()}
function save(){dbSet('state',state)}
function getAlb(id=state.currentId){return state.drafts.find(x=>x.id===id)}
function emptyHours(){return{normales:0,extras:0,nocturnas:0,festivas:0,dietas:0,desplazH:0,desplazKm:0}}
function newDraft(renderNow=true){const a={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),numero:null,estado:'borrador',version:1,history:[],modReason:'',tecnicoResponsable:'',cliente:'',centroMode:'existing',codigoCentro:'',centro:'',direccion:'',poblacion:'',provincia:'',cp:'',km:'',gestor:'',centroNuevo:false,fecha:new Date().toISOString().slice(0,10),tipoInstalacion:'',nPedido:'',responsable:'',workOriginal:'',workEs:'',workTranslationState:'',obsOriginal:'',obsEs:'',materials:[],technicians:[],photos:[],firmaTecnico:null,firmaCliente:null,clientNoSign:false,noSignReason:'',sello:null,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};state.drafts.unshift(a);state.currentId=a.id;ui.step=0;save();if(renderNow)render()}
function changeLang(l){ui.lang=l;localStorage.setItem('mir_lang',l);render();networkUpdate()}
function t(k){return (TXT[ui.lang]||TXT.es)[k]||TXT.es[k]||k}
function markSaved(){const el=document.getElementById('saveText');if(el){el.textContent=t('saved');setTimeout(()=>{if(el)el.textContent=t('saved')},800)}}
function networkUpdate(){const bar=document.getElementById('networkBar'),txt=document.getElementById('networkText');bar.classList.toggle('offline',!navigator.onLine);txt.textContent=navigator.onLine?t('online'):t('offline')}
addEventListener('online',networkUpdate);addEventListener('offline',networkUpdate);
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function badge(a){if(a.estado==='enviado')return '<span class="badge b-sent">'+t('sent')+'</span>';if(a.estado==='pendiente')return '<span class="badge b-pending">'+t('pending')+'</span>';if(a.version>1)return '<span class="badge b-mod">v'+a.version+' · '+t('modified')+'</span>';return '<span class="badge b-draft">'+t('draft')+'</span>'}
function render(){const a=getAlb();if(!a)return;document.getElementById('backBtn').textContent=t('back');const nb=document.getElementById('nextBtn');nb.textContent=ui.step===7?t('send'):ui.step===6?t('review'):t('next');document.getElementById('app').innerHTML=hero(a)+stepHtml(a);afterRender(a)}
function hero(a){return `<div class="hero"><div class="hero-row"><div><h1>${t(STEPS[ui.step])}</h1><p>${ui.lang==='es'?'Demo V1 · preparada para backend gratuito y sincronización central':'MIR mobile workflow · V1 demo'}</p></div><div class="alb-tag"><div class="alb-num">${a.numero||'BORRADOR'}</div>${badge(a)}</div></div><div class="progress">${STEPS.map((_,i)=>`<div class="pstep ${i<=ui.step?'on':''}"></div>`).join('')}</div><div class="step-label">${ui.step+1} / ${STEPS.length}</div></div>`}
function stepHtml(a){switch(ui.step){case 0:return techStep(a);case 1:return clientStep(a);case 2:return workStep(a);case 3:return materialStep(a);case 4:return hoursStep(a);case 5:return photosStep(a);case 6:return reviewStep(a);case 7:return signStep(a)}}
function techStep(a){return `<section class="card"><div class="card-h"><span class="stepn">1</span><h2>${t('tech')}</h2></div><div class="card-b"><div class="grid g2"><div class="field"><label>${t('tech')} <span class="req">*</span></label><input value="${esc(a.tecnicoResponsable)}" oninput="setF('tecnicoResponsable',this.value)" placeholder="Nombre y apellidos"></div><div class="field"><label>Fecha <span class="req">*</span></label><input type="date" value="${esc(a.fecha)}" oninput="setF('fecha',this.value)"></div><div class="field"><label>Tipo de instalación</label><input value="${esc(a.tipoInstalacion)}" oninput="setF('tipoInstalacion',this.value)" placeholder="CO2, transcrítico..."></div><div class="field"><label>Nº pedido / OT</label><input value="${esc(a.nPedido)}" oninput="setF('nPedido',this.value)"></div></div><p class="hint">El nombre del técnico queda guardado en el albarán. No hace falta crear usuarios para esta demo.</p></div></section>`}
function clientsOptions(a){return ['<option value="">— Selecciona cliente —</option>',...CLIENTES_LIST.map(c=>`<option value="${esc(c)}" ${a.cliente===c?'selected':''}>${esc(c)}</option>`)].join('')}
function centerOptions(a){return ['<option value="">— Selecciona centro —</option>',...CENTROS.filter(c=>c.cliente===a.cliente).map(c=>`<option value="${esc(c.codigo)}" ${a.codigoCentro===c.codigo?'selected':''}>${esc(c.centro)}${c.poblacion?' — '+esc(c.poblacion):''}</option>`)].join('')}
function clientStep(a){const isNew=a.centroMode==='new';return `<section class="card"><div class="card-h"><span class="stepn">2</span><h2>${t('client')}</h2></div><div class="card-b"><div class="field"><label>Cliente <span class="req">*</span></label><select onchange="setClient(this.value)">${clientsOptions(a)}</select></div>${a.cliente?`<div class="divider"></div><div class="choice"><button class="${!isNew?'active':''}" onclick="setCenterMode('existing')">Centro existente</button><button class="${isNew?'active':''}" onclick="setCenterMode('new')">+ ${t('newCenter')}</button></div>${!isNew?`<div class="field" style="margin-top:10px"><label>Centro <span class="req">*</span></label><select onchange="setCenter(this.value)">${centerOptions(a)}</select></div>${a.centro?centerInfo(a):''}`:newCenterFields(a)}`:''}${a.cliente&&a.cliente.toUpperCase().includes('DRUNI')?'<div class="flag">🏷️ DRUNI: el sello del centro será obligatorio antes de finalizar.</div>':''}</div></section>`}
function centerInfo(a){return `<div class="center-info"><div class="center-title">${esc(a.centro)}</div><div class="center-meta">${esc([a.direccion,a.poblacion,a.cp,a.provincia].filter(Boolean).join(' · '))}${a.km?' · '+esc(a.km)+' km':''}</div></div>`}
function newCenterFields(a){return `<div class="new-center"><div class="grid g2"><div class="field"><label>Nombre del centro <span class="req">*</span></label><input value="${esc(a.centro)}" oninput="setNewCenter('centro',this.value)"></div><div class="field"><label>Dirección <span class="req">*</span></label><input value="${esc(a.direccion)}" oninput="setNewCenter('direccion',this.value)"></div><div class="field"><label>Localidad <span class="req">*</span></label><input value="${esc(a.poblacion)}" oninput="setNewCenter('poblacion',this.value)"></div><div class="field"><label>Provincia</label><input value="${esc(a.provincia)}" oninput="setNewCenter('provincia',this.value)"></div><div class="field"><label>Código postal</label><input value="${esc(a.cp)}" oninput="setNewCenter('cp',this.value)"></div><div class="field"><label>Km / referencia</label><input value="${esc(a.km)}" oninput="setNewCenter('km',this.value)"></div></div><div class="flag">Centro nuevo: llegará identificado así a Administración para su revisión.</div></div>`}
function workStep(a){return `<section class="card"><div class="card-h"><span class="stepn">3</span><h2>${t('work')}</h2><small>${LANGS[ui.lang].name}</small></div><div class="card-b"><div class="field"><label>${t('work')} <span class="req">*</span></label><textarea id="workInput" oninput="setF('workOriginal',this.value);translationDirty('work')" placeholder="Describe el trabajo realizado...">${esc(a.workOriginal)}</textarea><div class="voicebar"><button class="btn secondary" onclick="dictate('workInput','workOriginal')">🎙️ Dictar</button><button class="btn secondary" onclick="translateField('work')">🌐 Traducir a español</button></div><div class="trans-state">${esc(a.workTranslationState||'')}</div>${a.workEs&&a.workEs!==a.workOriginal?`<div class="trans-preview"><b>Español:</b><br>${esc(a.workEs)}</div>`:''}</div><div class="divider"></div><div class="field"><label>Observaciones</label><textarea id="obsInput" oninput="setF('obsOriginal',this.value);translationDirty('obs')" placeholder="Observaciones adicionales...">${esc(a.obsOriginal)}</textarea><div class="voicebar"><button class="btn secondary" onclick="dictate('obsInput','obsOriginal')">🎙️ Dictar</button><button class="btn secondary" onclick="translateField('obs')">🌐 Traducir a español</button></div>${a.obsEs&&a.obsEs!==a.obsOriginal?`<div class="trans-preview"><b>Español:</b><br>${esc(a.obsEs)}</div>`:''}</div><div class="warning" style="margin-top:12px">La demo usa traducción gratuita del navegador cuando está disponible. Si el dispositivo no la soporta, conserva el original y marca la traducción como pendiente.</div></div></section>`}
function materialStep(a){return `<section class="card"><div class="card-h"><span class="stepn">4</span><h2>${t('materials')}</h2><small>${a.materials.length}</small></div><div class="card-b"><div id="materialsList">${a.materials.map((m,i)=>matRow(m,i)).join('')}</div><div class="autocomplete"><div class="field"><label>Buscar por código, referencia o descripción</label><input id="matSearch" oninput="searchMat(this.value)" placeholder="Ej. R410, válvula, 00308..."></div><div id="acList"></div></div><div class="divider"></div><button class="btn secondary wide" onclick="addManualMaterial()">+ Material no incluido en catálogo</button><p class="hint">Los técnicos no ven precios. Los materiales manuales quedan pendientes de valoración por Administración.</p></div></section>`}
function matRow(m,i){return `<div class="item"><div class="split"><div><div class="item-title">${esc(m.descripcion||'Material nuevo')}</div><div class="item-meta">${esc(m.codigo||'SIN CÓDIGO')} ${m.referencia?'· Ref. '+esc(m.referencia):''}${m.manual?' · Pendiente de valoración':''}</div></div><button class="btn danger-lite" onclick="removeMaterial(${i})">Quitar</button></div><div class="row" style="margin-top:8px"><div class="field" style="flex:1"><label>Cantidad</label><input class="qty" inputmode="decimal" value="${esc(m.cantidad)}" oninput="updateMaterial(${i},'cantidad',this.value)"></div>${m.manual?`<div class="field" style="flex:3"><label>Descripción</label><input value="${esc(m.descripcion)}" oninput="updateMaterial(${i},'descripcion',this.value)"></div>`:''}</div></div>`}
function hoursStep(a){return `<section class="card"><div class="card-h"><span class="stepn">5</span><h2>${t('hours')}</h2><small>${a.technicians.length}</small></div><div class="card-b">${a.technicians.map((x,i)=>techHours(x,i)).join('')}<button class="btn secondary wide" onclick="addTechnician()">+ Añadir técnico</button><p class="hint">Un mismo albarán puede incluir varios técnicos. Solo se registran cantidades; las tarifas pertenecen a Administración.</p></div></section>`}
function techHours(x,i){const labels={normales:'Horas normales',extras:'Horas extra',nocturnas:'Nocturnas',festivas:'Festivas',dietas:'Dietas',desplazH:'Horas desplazamiento',desplazKm:'Kilómetros'};return `<div class="tech-card"><div class="split"><b>Técnico ${i+1}</b><button class="btn danger-lite" onclick="removeTechnician(${i})">Quitar</button></div><div class="field" style="margin-top:8px"><label>Nombre</label><input value="${esc(x.nombre)}" oninput="updateTech(${i},'nombre',this.value)"></div><div class="hours-grid">${Object.keys(labels).map(k=>`<div class="mini"><label>${labels[k]}</label><input inputmode="decimal" value="${esc(x.horas[k]||'')}" oninput="updateHour(${i},'${k}',this.value)"></div>`).join('')}</div></div>`}
function photosStep(a){return `<section class="card"><div class="card-h"><span class="stepn">6</span><h2>${t('photos')}</h2><small>${a.photos.length}/5</small></div><div class="card-b"><div class="photo-grid">${a.photos.map((p,i)=>`<div class="photo"><img src="${p}"><button onclick="removePhoto(${i})">×</button></div>`).join('')}${a.photos.length<5?'<button class="photo-add" onclick="document.getElementById(\'photoInput\').click()">+</button>':''}</div><p class="hint">Máximo 5 fotos. Se comprimen automáticamente para reducir peso y permitir trabajo móvil.</p></div></section>`}
function reviewStep(a){const work=spanishText(a,'work'),obs=spanishText(a,'obs');return `<section class="card"><div class="card-h"><span class="stepn">7</span><h2>${t('reviewTitle')}</h2></div><div class="card-b"><div class="ok">Esta es la versión que verá el cliente antes de firmar. El PDF final estará siempre en español.</div><div class="review" style="margin-top:10px"><h3>MIR · Albarán</h3><dl><dt>Técnico</dt><dd>${esc(a.tecnicoResponsable||'—')}</dd><dt>Fecha</dt><dd>${esc(a.fecha||'—')}</dd><dt>Cliente</dt><dd>${esc(a.cliente||'—')}</dd><dt>Centro</dt><dd>${esc(a.centro||'—')}${a.centroNuevo?' (CENTRO NUEVO)':''}</dd><dt>Dirección</dt><dd>${esc([a.direccion,a.poblacion,a.cp].filter(Boolean).join(', ')||'—')}</dd><dt>Trabajo</dt><dd>${esc(work||'—')}</dd><dt>Observaciones</dt><dd>${esc(obs||'—')}</dd><dt>Materiales</dt><dd>${a.materials.length?`<ul>${a.materials.map(m=>`<li>${esc(m.descripcion)} · ${esc(m.cantidad||0)}</li>`).join('')}</ul>`:'—'}</dd><dt>Técnicos</dt><dd>${a.technicians.length?`<ul>${a.technicians.map(x=>`<li>${esc(x.nombre||'Sin nombre')} · ${hoursSummary(x.horas)}</li>`).join('')}</ul>`:'—'}</dd><dt>Fotos</dt><dd>${a.photos.length}</dd></dl></div><div class="row wrap" style="margin-top:10px"><button class="btn secondary" onclick="window.print()">🖨️ Vista PDF / imprimir</button></div></div></section>`}
function signStep(a){const druni=a.cliente.toUpperCase().includes('DRUNI');return `<section class="card"><div class="card-h"><span class="stepn">8</span><h2>${t('sign')}</h2></div><div class="card-b"><div class="sig-grid"><div class="sigbox"><h4>Firma técnico <span class="req">*</span></h4><div class="canvas-wrap"><canvas id="sigTech"></canvas><span class="sig-hint" id="hintTech">Firma aquí</span></div><div class="row" style="margin-top:7px"><button class="btn secondary" onclick="clearSig('tech')">Limpiar</button></div></div><div class="sigbox"><h4>Firma cliente ${a.clientNoSign?'':'<span class="req">*</span>'}</h4><div class="canvas-wrap ${a.clientNoSign?'hidden':''}"><canvas id="sigClient"></canvas><span class="sig-hint" id="hintClient">Firma aquí</span></div><div class="row" style="margin-top:7px"><button class="btn secondary ${a.clientNoSign?'hidden':''}" onclick="clearSig('client')">Limpiar</button></div><div class="divider"></div><label class="checkrow"><input type="checkbox" ${a.clientNoSign?'checked':''} onchange="toggleNoSign(this.checked)"><span>${t('clientNoSign')}</span></label>${a.clientNoSign?`<div class="field" style="margin-top:8px"><label>${t('noSignReason')} <span class="req">*</span></label><textarea oninput="setF('noSignReason',this.value)" placeholder="Cliente ausente, rechaza firmar...">${esc(a.noSignReason)}</textarea></div>`:''}</div></div>${druni?`<div class="divider"></div><div class="sigbox"><h4>🏷️ ${t('stamp')} <span class="req">*</span></h4><button class="btn purple" onclick="document.getElementById('stampInput').click()">${a.sello?'Cambiar sello':'Añadir sello'}</button>${a.sello?`<div><img class="stamp-preview" src="${a.sello}"></div>`:''}</div>`:''}<div class="warning" style="margin-top:12px">Al modificar posteriormente datos técnicos del albarán, las firmas deberán realizarse de nuevo y se generará una nueva versión.</div></div></section>`}
function setF(k,v){const a=getAlb();a[k]=v;a.updatedAt=new Date().toISOString();save()}
function setClient(v){const a=getAlb();a.cliente=v;a.codigoCentro='';a.centro='';a.direccion='';a.poblacion='';a.provincia='';a.cp='';a.km='';a.gestor='';a.centroNuevo=false;a.centroMode='existing';save();render()}
function setCenterMode(mode){const a=getAlb();a.centroMode=mode;a.codigoCentro='';a.centro='';a.direccion='';a.poblacion='';a.provincia='';a.cp='';a.km='';a.gestor='';a.centroNuevo=mode==='new';save();render()}
function setCenter(code){const a=getAlb(),c=CENTROS.find(x=>x.codigo===code&&x.cliente===a.cliente);a.codigoCentro=code;if(c)Object.assign(a,{centro:c.centro,direccion:c.direccion,poblacion:c.poblacion,provincia:c.provincia,cp:c.cp,km:c.km,gestor:c.gestor,centroNuevo:false});save();render()}
function setNewCenter(k,v){const a=getAlb();a[k]=v;a.centroNuevo=true;a.codigoCentro='NUEVO';save()}
function translationDirty(which){const a=getAlb();if(which==='work'){a.workEs='';a.workTranslationState='Traducción pendiente'}else a.obsEs='';save()}
function spanishText(a,which){const orig=which==='work'?a.workOriginal:a.obsOriginal, es=which==='work'?a.workEs:a.obsEs;return ui.lang==='es'?orig:(es||orig)}
async function translateField(which){const a=getAlb();const orig=which==='work'?a.workOriginal:a.obsOriginal;if(!orig.trim())return toast('No hay texto que traducir');if(ui.lang==='es'){if(which==='work'){a.workEs=orig;a.workTranslationState='Ya está en español'}else a.obsEs=orig;save();render();return}try{if(!('Translator' in self))throw new Error('unsupported');let availability=await Translator.availability({sourceLanguage:ui.lang,targetLanguage:'es'});if(availability==='unavailable')throw new Error('unavailable');const tr=await Translator.create({sourceLanguage:ui.lang,targetLanguage:'es'});const out=await tr.translate(orig);if(which==='work'){a.workEs=out;a.workTranslationState='Traducido en el dispositivo'}else a.obsEs=out;save();render()}catch(e){if(which==='work')a.workTranslationState='Traducción automática no disponible en este dispositivo · se conserva el original';save();render();toast('Traducción gratuita no disponible en este navegador') }}
function dictate(inputId,field){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('El dictado no está disponible en este navegador');const r=new SR();r.lang=LANGS[ui.lang].speech;r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{const text=e.results[0][0].transcript;const el=document.getElementById(inputId);el.value=(el.value?el.value+' ':'')+text;setF(field,el.value);translationDirty(field==='workOriginal'?'work':'obs')};r.onerror=()=>toast('No se pudo usar el micrófono');r.start();toast('Escuchando…')}
function searchMat(q){const box=document.getElementById('acList');if(!q.trim()){box.innerHTML='';return}const z=q.toLowerCase();const results=ARTICULOS.filter(x=>(x.codigo+' '+x.referencia+' '+x.descripcion).toLowerCase().includes(z)).slice(0,20);box.innerHTML=`<div class="ac-list">${results.map(x=>`<div class="ac" onclick="pickMat('${x.codigo.replace(/'/g,"\\'")}')"><b>${esc(x.descripcion)}</b><span>${esc(x.codigo)}${x.referencia?' · '+esc(x.referencia):''}</span></div>`).join('')||'<div class="ac">Sin resultados</div>'}</div>`}
function pickMat(code){const a=getAlb(),x=ARTICULOS.find(y=>y.codigo===code);if(!x)return;a.materials.push({...x,cantidad:1,manual:false});save();render()}
function addManualMaterial(){getAlb().materials.push({codigo:'',descripcion:'',referencia:'',cantidad:1,manual:true});save();render()}
function removeMaterial(i){getAlb().materials.splice(i,1);save();render()}
function updateMaterial(i,k,v){getAlb().materials[i][k]=v;save()}
function addTechnician(){getAlb().technicians.push({nombre:'',horas:emptyHours()});save();render()}
function removeTechnician(i){getAlb().technicians.splice(i,1);save();render()}
function updateTech(i,k,v){getAlb().technicians[i][k]=v;save()}
function updateHour(i,k,v){getAlb().technicians[i].horas[k]=v;save()}
function hoursSummary(h){const parts=[];if(+h.normales)parts.push('normales '+h.normales);if(+h.extras)parts.push('extra '+h.extras);if(+h.nocturnas)parts.push('noct. '+h.nocturnas);if(+h.festivas)parts.push('fest. '+h.festivas);if(+h.dietas)parts.push('dietas '+h.dietas);if(+h.desplazH)parts.push('despl. '+h.desplazH+'h');if(+h.desplazKm)parts.push(h.desplazKm+' km');return parts.join(', ')||'sin horas'}
async function handlePhotos(files){const a=getAlb();for(const f of Array.from(files).slice(0,5-a.photos.length)){a.photos.push(await compressImage(f,1280,.72))}save();render();document.getElementById('photoInput').value=''}
async function handleStamp(f){if(!f)return;getAlb().sello=await compressImage(f,1000,.78);save();render();document.getElementById('stampInput').value=''}
function removePhoto(i){getAlb().photos.splice(i,1);save();render()}
function compressImage(file,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;if(Math.max(w,h)>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function afterRender(a){if(ui.step===7){initSig('sigTech','firmaTecnico','hintTech');if(!a.clientNoSign)initSig('sigClient','firmaCliente','hintClient')}}
function initSig(id,field,hintId){const c=document.getElementById(id);if(!c)return;const dpr=devicePixelRatio||1;const rect=c.getBoundingClientRect();c.width=Math.max(1,rect.width*dpr);c.height=Math.max(1,rect.height*dpr);const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2;ctx.lineCap='round';const a=getAlb();if(a[field]){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,rect.width,rect.height);im.src=a[field];document.getElementById(hintId).style.display='none'}let drawing=false,last=null;const pos=e=>{const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[p.clientX-r.left,p.clientY-r.top]};const start=e=>{e.preventDefault();drawing=true;last=pos(e);document.getElementById(hintId).style.display='none'};const move=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p};const end=()=>{if(!drawing)return;drawing=false;a[field]=c.toDataURL('image/png');save()};c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);addEventListener('pointerup',end)}
function clearSig(which){const a=getAlb();if(which==='tech')a.firmaTecnico=null;else a.firmaCliente=null;save();render()}
function toggleNoSign(v){const a=getAlb();a.clientNoSign=v;if(v)a.firmaCliente=null;else a.noSignReason='';save();render()}
function validateStep(s=ui.step){const a=getAlb();if(s===0){if(!a.tecnicoResponsable.trim())return 'Indica el técnico responsable';if(!a.fecha)return 'Indica la fecha'}if(s===1){if(!a.cliente)return 'Selecciona un cliente';if(!a.centro.trim())return 'Selecciona o crea un centro';if(a.centroNuevo&&(!a.direccion.trim()||!a.poblacion.trim()))return 'En un centro nuevo, dirección y localidad son obligatorias'}if(s===2&&!a.workOriginal.trim())return 'Describe el trabajo realizado';if(s===7){if(!a.firmaTecnico)return 'Falta la firma del técnico';if(a.clientNoSign&&!a.noSignReason.trim())return 'Indica por qué el cliente no firma';if(!a.clientNoSign&&!a.firmaCliente)return 'Falta la firma del cliente';if(a.cliente.toUpperCase().includes('DRUNI')&&!a.sello)return 'En DRUNI el sello es obligatorio'}return ''}
function nextStep(){const e=validateStep();if(e)return toast(e);if(ui.step<7){ui.step++;render();scrollTo({top:0,behavior:'smooth'})}else finalize()}
function prevStep(){if(ui.step>0){ui.step--;render();scrollTo({top:0,behavior:'smooth'})}else openHistory()}
function snapshot(a){const c=structuredClone?structuredClone(a):JSON.parse(JSON.stringify(a));delete c.history;return c}
function finalize(){const a=getAlb();const err=validateStep(7);if(err)return toast(err);if(!a.workEs&&ui.lang==='es')a.workEs=a.workOriginal;if(!a.obsEs&&ui.lang==='es')a.obsEs=a.obsOriginal;const snap=snapshot(a);a.history.push({version:a.version,date:new Date().toISOString(),reason:a.modReason||'Envío inicial',snapshot:snap});a.estado=navigator.onLine?'pendiente':'pendiente';if(!a.numero)a.numero='DEMO-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+String(state.localSeq++).padStart(3,'0');a.updatedAt=new Date().toISOString();save();toast('Albarán finalizado · pendiente de sincronización con backend');render();setTimeout(()=>window.print(),500)}
function createRevision(id){const a=state.drafts.find(x=>x.id===id);if(!a)return;const reason=prompt('Motivo de la modificación:');if(!reason?.trim())return;const n=JSON.parse(JSON.stringify(a));n.id=crypto.randomUUID?crypto.randomUUID():String(Date.now());n.version=a.version+1;n.estado='borrador';n.modReason=reason.trim();n.firmaTecnico=null;n.firmaCliente=null;n.sello=null;n.clientNoSign=false;n.noSignReason='';n.createdAt=new Date().toISOString();n.updatedAt=n.createdAt;state.drafts.unshift(n);state.currentId=n.id;ui.step=0;save();closeHistory();render();toast('Nueva versión creada · requiere nuevas firmas')}
function openHistory(){document.getElementById('historyModal').classList.add('open');const list=document.getElementById('historyList');list.innerHTML=state.drafts.map(a=>`<div class="history-item"><div class="split"><div><b>${esc(a.numero||'BORRADOR')} · v${a.version}</b><div>${esc(a.cliente||'Sin cliente')} ${a.centro?'· '+esc(a.centro):''}</div><div style="color:#6b7280">${new Date(a.updatedAt).toLocaleString('es-ES')}</div></div><div>${badge(a)}</div></div><div class="row wrap" style="margin-top:7px"><button class="btn secondary" onclick="openDraft('${a.id}')">Abrir</button>${a.estado!=='borrador'?`<button class="btn secondary" onclick="createRevision('${a.id}')">Modificar</button>`:''}</div></div>`).join('')||'<p>Sin albaranes</p>'}
function closeHistory(){document.getElementById('historyModal').classList.remove('open')}
function openDraft(id){state.currentId=id;ui.step=0;save();closeHistory();render()}
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3000)}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
load();
